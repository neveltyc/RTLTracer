name: bundle

# Rebuild the single-file bundle and publish it to dist-bundle whenever the
# package sources change. Doc / test / script changes do not trigger it.
on:
  push:
    branches: [main]
    paths:
      - 'rtltracer/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bundle-dist
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -e .

      - name: Test
        run: python -m pytest tests/ -q

      - name: Verify bundle matches the package
        run: |
          python scripts/bundle.py
          diff <(python -m rtltracer.cli info tests/fixtures/sample.db --json) \
               <(python dist/rtltracer.py     info tests/fixtures/sample.db --json)

      - name: Publish to dist-bundle
        run: |
          git config user.name  "neveltyc"
          git config user.email "neveltyc@gmail.com"
          bash scripts/publish-bundle.sh origin
